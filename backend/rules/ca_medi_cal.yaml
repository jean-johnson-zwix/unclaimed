id: ca_medi_cal
name: Medi-Cal (CA Medicaid)
agency: CA DHCS
category: health
jurisdiction: [federal, CA]
is_hub: true
description: California's Medicaid program - free or low-cost health coverage.
apply_url: https://www.coveredca.com
effective_date: "2026-01"

conditions:
  - id: medi_cal_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 138
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below 138% FPL

  - id: medi_cal_geographic
    type: geographic
    measure: state
    operator: in
    value: [CA]
    hard_gate: true
    verifiable: true
    label: California residency

categorically_qualifies:
  - extra_help
  - lifeline
  - free_phone
