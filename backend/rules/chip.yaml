id: chip
name: KidsCare (AZ CHIP)
agency: AHCCCS
category: health
jurisdiction: [federal, AZ]
is_hub: false
description: Low-cost health coverage for children in families earning too much for Medicaid.
apply_url: https://www.healthearizonaplus.gov
effective_date: "2026-01"

conditions:
  - id: chip_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 200
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below 200% FPL

  - id: chip_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant]
    hard_gate: true
    verifiable: true
    label: Must have children under 19

  - id: chip_geographic
    type: geographic
    measure: state
    operator: in
    value: [AZ]
    hard_gate: true
    verifiable: true
    label: Arizona residency
