id: ccdf
name: Child Care Assistance (DES)
agency: AZ DES
category: childcare
jurisdiction: [federal, AZ]
is_hub: false
description: Subsidized child care for working families or families in education/training.
apply_url: https://des.az.gov/services/child-and-family/child-care
effective_date: "2026-01"

conditions:
  - id: ccdf_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 165
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below 165% FPL

  - id: ccdf_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant]
    hard_gate: true
    verifiable: true
    label: Must have children under 13

  - id: ccdf_geographic
    type: geographic
    measure: state
    operator: in
    value: [AZ]
    hard_gate: true
    verifiable: true
    label: Arizona residency

streamlined_by:
  - {from: snap, satisfies: [ccdf_income]}
  - {from: tanf, satisfies: [ccdf_income]}
  - {from: ssi, satisfies: [ccdf_income]}
