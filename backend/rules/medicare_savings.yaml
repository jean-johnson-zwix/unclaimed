id: medicare_savings
name: Medicare Savings Programs (QMB/SLMB/QI)
agency: CMS / AHCCCS
category: health
jurisdiction: [federal, AZ]
is_hub: false
description: Pays Medicare premiums, deductibles, and coinsurance for low-income Medicare beneficiaries.
apply_url: https://www.medicare.gov/basics/costs/help/medicare-savings-programs
effective_date: "2026-01"

conditions:
  - id: msave_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 135
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below 135% FPL

  - id: msave_senior
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [senior_65plus, disabled]
    hard_gate: true
    verifiable: true
    label: Must be Medicare-eligible (65+ or disabled)
