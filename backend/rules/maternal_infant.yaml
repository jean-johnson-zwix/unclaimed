id: maternal_infant
name: Maternal & Infant Health (Title V)
agency: HRSA
category: health
jurisdiction: [federal, AZ]
is_hub: false
description: Prenatal care, well-baby visits, and health education for pregnant women and infants.
apply_url: https://mchb.hrsa.gov/programs-impact/title-v-maternal-child-health-block-grant
effective_date: "2026-01"

conditions:
  - id: mih_category
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [pregnant, infant, has_child_under_5]
    hard_gate: true
    verifiable: true
    label: Must be pregnant or have infant/young child

  - id: mih_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 200
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below 200% FPL

streamlined_by:
  - {from: medicaid, satisfies: [mih_income]}
  - {from: wic, satisfies: [mih_income, mih_category]}
