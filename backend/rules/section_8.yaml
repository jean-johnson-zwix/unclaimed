id: section_8
name: Section 8 (Housing Choice Voucher)
agency: HUD
category: housing
jurisdiction: [federal, AZ]
is_hub: false
description: Rental assistance voucher for low-income families.
apply_url: https://www.hud.gov/topics/housing_choice_voucher_program_section_8
effective_date: "2026-01"

conditions:
  - id: section_8_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 50
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income limit (50% area median income, approximated)

  - id: section_8_waitlist
    type: clinical
    hard_gate: true
    verifiable: false
    label: Waitlist availability (agency determination)
    description: Most areas have closed waitlists
