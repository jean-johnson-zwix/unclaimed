id: federal_cdcc
name: Child & Dependent Care Credit (Federal)
agency: IRS
category: tax_credit
jurisdiction: [federal]
is_hub: false
description: Federal tax credit for child/dependent care expenses while working or looking for work.
apply_url: https://www.irs.gov/credits-deductions/individuals/child-and-dependent-care-credit-information
effective_date: "2026-01"

conditions:
  - id: cdcc_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant]
    hard_gate: true
    verifiable: true
    label: Must have dependent children under 13

  - id: cdcc_income
    type: income_threshold
    measure: gross_annual_income
    operator: ">="
    value: 1
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Must have earned income
