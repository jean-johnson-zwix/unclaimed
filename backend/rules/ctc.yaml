id: ctc
name: Child Tax Credit (CTC)
agency: IRS
category: tax_credit
jurisdiction: [federal]
is_hub: false
description: Tax credit up to $2,000 per qualifying child.
apply_url: https://www.irs.gov/credits-deductions/individuals/child-tax-credit
effective_date: "2026-01"

conditions:
  - id: ctc_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 400
    unit: pct_fpl
    hard_gate: false
    verifiable: true
    label: Income limit (phases out above ~$200k single/$400k joint)

  - id: ctc_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant]
    hard_gate: true
    verifiable: true
    label: Must have qualifying child under 17

streamlined_by:
  - {from: eitc, satisfies: [ctc_income]}
