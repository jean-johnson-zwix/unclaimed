id: summer_ebt
name: Summer EBT
agency: USDA FNS
category: nutrition
jurisdiction: [federal]
is_hub: false
description: Summer grocery benefits for families with school-age children.
apply_url: https://www.fns.usda.gov/sebt
effective_date: "2026-01"

conditions:
  - id: summer_ebt_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 185
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income limit (185% FPL)

  - id: summer_ebt_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5]
    hard_gate: true
    verifiable: true
    label: Must have school-age children
