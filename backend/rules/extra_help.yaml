id: extra_help
name: Medicare Extra Help (LIS)
agency: SSA / CMS
category: health
jurisdiction: [federal]
is_hub: false
description: Helps pay Medicare Part D prescription drug costs.
apply_url: https://www.ssa.gov/medicare/part-d-extra-help
effective_date: "2026-01"

conditions:
  - id: extra_help_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 150
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income limit (150% FPL)

  - id: extra_help_assets
    type: asset
    measure: assets
    operator: "<="
    value: 17220
    unit: usd
    hard_gate: true
    verifiable: true
    label: Asset limit ($17,220 individual)
