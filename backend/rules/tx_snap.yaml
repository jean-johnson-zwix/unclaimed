id: tx_snap
name: SNAP (Texas)
agency: TX HHSC
category: nutrition
jurisdiction: [federal, TX]
is_hub: true
description: Texas SNAP - monthly food benefits on a Lone Star Card.
apply_url: https://www.yourtexasbenefits.com
effective_date: "2026-01"

conditions:
  - id: tx_snap_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 165
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Gross income limit (165% FPL)

  - id: tx_snap_geographic
    type: geographic
    measure: state
    operator: in
    value: [TX]
    hard_gate: true
    verifiable: true
    label: Texas residency

categorically_qualifies:
  - school_meals
  - lifeline
  - free_phone
  - snap_ed
  - tefap
