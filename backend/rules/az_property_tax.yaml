id: az_property_tax
name: AZ Senior Property Tax Freeze
agency: AZ Dept. of Revenue
category: tax_credit
jurisdiction: [AZ]
is_hub: false
description: Freezes property tax valuation for qualifying seniors.
apply_url: https://azdor.gov/forms/property-forms
effective_date: "2026-01"

conditions:
  - id: az_prop_senior
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [senior_65plus]
    hard_gate: true
    verifiable: true
    label: Must be 65 or older

  - id: az_prop_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 250
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income at or below ~$40k (approx 250% FPL single)

  - id: az_prop_geographic
    type: geographic
    measure: state
    operator: in
    value: [AZ]
    hard_gate: true
    verifiable: true
    label: Arizona residency
