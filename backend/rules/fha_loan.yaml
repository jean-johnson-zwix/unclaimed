id: fha_loan
name: FHA Home Loan
agency: HUD / FHA
category: housing
jurisdiction: [federal]
is_hub: false
description: Low down payment mortgage (3.5%) with flexible credit requirements.
apply_url: https://www.hud.gov/buying/loans
effective_date: "2026-01"

conditions:
  - id: fha_income
    type: income_threshold
    measure: gross_annual_income
    operator: ">="
    value: 50
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Must have some earned income

  - id: fha_age
    type: age
    measure: age
    operator: ">="
    value: 18
    hard_gate: true
    verifiable: true
    label: Must be 18 or older
