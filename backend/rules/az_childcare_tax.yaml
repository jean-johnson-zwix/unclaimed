id: az_childcare_tax
name: AZ Child & Dependent Care Credit
agency: AZ Dept. of Revenue
category: tax_credit
jurisdiction: [AZ]
is_hub: false
description: State tax credit for child care expenses (in addition to the federal credit).
apply_url: https://azdor.gov/forms/individual
effective_date: "2026-01"

conditions:
  - id: az_cc_child
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant]
    hard_gate: true
    verifiable: true
    label: Must have dependent children

  - id: az_cc_geographic
    type: geographic
    measure: state
    operator: in
    value: [AZ]
    hard_gate: true
    verifiable: true
    label: Arizona residency

  - id: az_cc_income
    type: income_threshold
    measure: gross_annual_income
    operator: ">="
    value: 1
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Must have earned income
