id: wic
name: WIC
agency: USDA FNS / AZ DHS
category: nutrition
jurisdiction: [federal, AZ]
is_hub: false
description: Nutrition assistance for pregnant/postpartum women, infants, and children under 5.
apply_url: https://www.fns.usda.gov/wic
effective_date: "2026-01"

conditions:
  - id: wic_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 185
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income limit (185% FPL)

  - id: wic_category
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [pregnant, postpartum, infant, has_child_under_5]
    logic_group: wic_cat
    hard_gate: true
    verifiable: true
    label: Pregnant, postpartum, infant, or child under 5

  - id: wic_nutritional_risk
    type: clinical
    hard_gate: true
    verifiable: false
    label: Nutritional risk (agency determination)
    description: Nutritional risk determined by a health professional

streamlined_by:
  - {from: snap, satisfies: [wic_income]}
  - {from: medicaid, satisfies: [wic_income]}
  - {from: tanf, satisfies: [wic_income]}
