id: tanf
name: TANF (Cash Assistance)
agency: AZ DES
category: cash
jurisdiction: [federal, AZ]
is_hub: true
description: Temporary cash assistance for families with children.
apply_url: https://www.healthearizonaplus.gov
effective_date: "2026-01"

conditions:
  - id: tanf_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 75
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Income limit (~75% FPL)

  - id: tanf_children
    type: categorical
    measure: household_categories
    operator: includes_any
    value: [has_child, has_child_under_5, infant, pregnant]
    hard_gate: true
    verifiable: true
    logic_group: tanf_child
    label: Must have dependent children or be pregnant

  - id: tanf_assets
    type: asset
    measure: assets
    operator: "<="
    value: 2000
    unit: usd
    hard_gate: true
    verifiable: true
    label: Asset limit

  - id: tanf_geographic
    type: geographic
    measure: state
    operator: in
    value: [AZ]
    hard_gate: true
    verifiable: true
    label: Arizona residency

categorically_qualifies:
  - snap
  - head_start
  - weatherization
  - school_meals
