id: ca_calfresh
name: CalFresh (CA SNAP)
agency: CA DSS
category: nutrition
jurisdiction: [federal, CA]
is_hub: true
description: California's SNAP program - monthly food benefits on an EBT card.
apply_url: https://www.getcalfresh.org
effective_date: "2026-01"

conditions:
  - id: calfresh_income
    type: income_threshold
    measure: gross_annual_income
    operator: "<="
    value: 200
    unit: pct_fpl
    hard_gate: true
    verifiable: true
    label: Gross income limit (200% FPL)

  - id: calfresh_geographic
    type: geographic
    measure: state
    operator: in
    value: [CA]
    hard_gate: true
    verifiable: true
    label: California residency

categorically_qualifies:
  - school_meals
  - lifeline
